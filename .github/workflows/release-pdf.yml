name: Generate PDF

on:
  release:
    types: [published]

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ReportLab
        run: pip install reportlab

      - name: Generate PDF
        run: python generate_pdf.py

      - name: Upload PDF
        uses: softprops/action-gh-release@v2
        with:
          files: report.pdf
